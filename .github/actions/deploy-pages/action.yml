name: Upload and deploy Pages
description: Package the current data revision and deploy the newly uploaded artifact
inputs:
  token:
    description: Repository Actions token
    required: true
  artifact-name:
    description: Unique name for this upload
    required: true
runs:
  using: composite
  steps:
    - id: upload
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: public
        name: ${{ inputs.artifact-name }}
    - name: Deploy the exact uploaded artifact
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: bash .github/scripts/deploy-pages.sh
