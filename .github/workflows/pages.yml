name: Publish data pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the uploaded artifact to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Pages upload did not return an artifact ID.'
            exit 1
          fi
          for attempt in {1..12}; do
            if visible=$(timeout 8s gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$ARTIFACT_NAME" \
              --jq ".artifacts[] | select(.id == $ARTIFACT_ID and .expired == false) | .id") \
              && [[ "$visible" == "$ARTIFACT_ID" ]]; then
              echo "Pages artifact $ARTIFACT_ID is visible after $attempt check(s)."
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::Pages artifact $ARTIFACT_ID is still unavailable for this run."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
