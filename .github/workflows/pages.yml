name: Publish data pages
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check whether this revision needs deployment
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository="repos/$GITHUB_REPOSITORY"
          head=$(timeout 10s gh api "$repository/git/ref/heads/master" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '::notice::A newer revision is available.'
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]] && published=$(timeout 10s gh api --method GET             "$repository/actions/workflows/pages.yml/runs" -f "head_sha=$GITHUB_SHA" -f status=success             -F per_page=1 --jq .total_count) && [[ "$published" =~ ^[1-9][0-9]*$ ]]; then
            echo '::notice::This revision has already deployed.'
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.needed == 'true'
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.needed == 'true'
      - name: Publish Pages
        id: publish
        if: steps.check.outputs.needed == 'true'
        continue-on-error: true
        uses: ./.github/actions/deploy-pages
        with:
          token: ${{ github.token }}
          artifact-name: github-pages-${{ github.run_attempt }}-1
      - name: Wait before uploading a new artifact
        if: steps.publish.outcome == 'failure'
        run: |
          echo '::warning::First Pages attempt failed. Retrying with a fresh artifact.'
          sleep 20
      - name: Retry publication
        id: retry
        if: steps.publish.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/deploy-pages
        with:
          token: ${{ github.token }}
          artifact-name: github-pages-${{ github.run_attempt }}-2
      - name: Wait before the final retry
        if: steps.retry.outcome == 'failure'
        run: |
          echo '::warning::Second Pages attempt failed. Retrying once more.'
          sleep 40
      - name: Final publication attempt
        if: steps.retry.outcome == 'failure'
        uses: ./.github/actions/deploy-pages
        with:
          token: ${{ github.token }}
          artifact-name: github-pages-${{ github.run_attempt }}-3
